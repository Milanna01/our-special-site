<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Наш маленький плейлист 🎵</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="music.css">
  <script src="music.js" defer></script>
</head>

<body>
  <a class="back-button" href="./home.html">← Назад к подаркам</a>

  <main class="music-page">
    <p class="eyebrow">A LITTLE PLAYLIST FOR YOU ♡</p>

    <h1>Просто слушай и расслабляйся</h1>

    <p class="subtitle">
      Маленький уголок для тебя любимой 💗
    </p>

    <div class="music-layout">
      <section class="player">
        <div class="vinyl" id="vinyl">
          <div class="vinyl-label">
            <span>♡</span>
          </div>
        </div>

        <h2 id="song-title">Выбери нашу песню</h2>
        <p id="song-artist">Маленькая музыка для души</p>

        <audio id="audio-player" preload="metadata"></audio>

        <div class="player-controls">
          <button id="play-button" type="button" aria-label="Воспроизвести">
            ▶
          </button>
        </div>
        <div class="volume-control">
  <span>🔈</span>
  <input
    type="range"
    id="volume-slider"
    min="0"
    max="100"
    value="50"
    aria-label="Громкость музыки"
  >
  <span>🔊</span>
  <span id="volume-value">70%</span>
</div>

        <p class="player-note">made with love ♡</p>
      </section>

      <section class="playlist">
        <h2>Твой плейлист ♡</h2>
        <div id="song-list"></div>
      </section>
    </div>
  </main>
</body>
</html>
