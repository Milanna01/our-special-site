<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Наш маленький мир ♡</title>

  <style>

  #password-screen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #fceaf1;
  padding: 20px;
}

.password-card {
  width: 100%;
  max-width: 430px;
  padding: 38px 32px;
  background: white;
  border-radius: 30px;
  box-shadow: 0 10px 35px rgba(190, 110, 145, 0.18);
  text-align: center;
}

.password-gif {
  display: block;
  width: 190px;
  max-width: 100%;
  height: auto;
  margin: 0 auto 22px;
  border-radius: 15px;
}

.password-card h1 {
  color: #b65f83;
  font-size: 29px;
  line-height: 1.3;
  margin: 0;
}

.password-hint {
  color: #a77a8d;
  font-size: 17px;
  margin: 20px 0;
}

#password-input {
  width: 100%;
  padding: 16px;
  border: 1px solid #f1c6d7;
  border-radius: 14px;
  background: #fff5f8;
  text-align: center;
  font-size: 19px;
  outline: none;
  margin-bottom: 14px;
}

#password-input:focus {
  border-color: #e99ab8;
}

#password-button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 25px;
  background: #e99ab8;
  color: white;
  font-size: 19px;
  cursor: pointer;
  transition: 0.2s;
}

#password-button:hover {
  background: #d980a2;
  transform: scale(1.02);
}

#password-error {
  color: #d45d83;
  font-size: 15px;
  min-height: 20px;
  margin: 12px 0 0;
}

.password-footer {
  color: #c17a98;
  font-size: 14px;
  margin: 14px 0 0;
}


    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    #global-audio {
      display: none;
    }
  </style>
</head>

<body>
  <div id="password-screen">
  <div class="password-card">
    <img
      src="./images/birthday-kitty.gif"
      alt="Милый котик с тортиком"
      class="password-gif"
    >

    <h1>Этот маленький мир твой ♡</h1>
    <p class="password-hint">
  У тебя есть маленький секретный ключик...
</p>

<input
  type="password"
  id="password-input"
  placeholder="Введи пароль"
  maxlength="4"
  inputmode="numeric"
>

<button id="password-button">
  Открыть ♡
</button>

<p id="password-error"></p>

  </div>
</div>
  <iframe
    id="page-frame"
    name="page-frame"
    src="./home.html"
    title="Наш маленький мир"
  ></iframe>

  <audio id="global-audio" preload="metadata"></audio>

  <script>
    const frame = document.getElementById("page-frame");
    const mainAudio = document.getElementById("global-audio");

    // При переходе на страницу письма останавливаем основную музыку
    frame.addEventListener("load", () => {
      try {
        const pageUrl = frame.contentWindow.location.pathname;

        if (pageUrl.endsWith("/wish.html")) {
          mainAudio.pause();
        }
      } catch (error) {
        console.log("Не удалось определить текущую страницу:", error);
      }
    });

    const passwordScreen = document.getElementById("password-screen");
const passwordInput = document.getElementById("password-input");
const passwordButton = document.getElementById("password-button");
const passwordError = document.getElementById("password-error");

function checkPassword() {
  if (passwordInput.value === "2212") {
    passwordScreen.style.display = "none";
  } else {
    passwordError.textContent =
      "Ошибочка, думай головой а не бицухой хахаха";
    passwordInput.value = "";
  }
}

passwordButton.addEventListener("click", checkPassword);

passwordInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    checkPassword();
  }
});

  </script>
</body>
</html>
